name: release

# Build the Raspberry Pi kiosk image and publish it as a GitHub
# Release. Tag-driven: pushing a `v*` tag (e.g. `v1.0.0`) triggers
# the full pipeline and attaches the `.img.gz` + `.sha256` to the
# release. `workflow_dispatch` runs the same build but uploads to
# the workflow's artifact store instead of cutting a release — use
# it for smoke-testing the pipeline before tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # needed by softprops/action-gh-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        # The build needs ~6 GB free (5 GB raw image + ~700 MB gz +
        # downloaded RPi OS Lite source). The ubuntu-latest runner
        # has ~14 GB free out of the box once a few preinstalled
        # SDKs are stripped — these two prunes are the cheapest big
        # wins.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support \
            parted gzip xz-utils curl openssl e2fsprogs \
            pipx
          # binfmt-support's post-install usually registers
          # qemu-aarch64 already, but make it idempotent.
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Install cijoe
        run: |
          pipx install cijoe
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Stamp version from tag
        # On tag pushes, override the in-tree __version__ literal with
        # the pushed tag (stripping the leading `v`). Keeps the
        # released image's reported version in lockstep with the tag
        # even if a manual bump was forgotten.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"${TAG}\"/" smashbox.py
          grep '^__version__' smashbox.py

      - name: Build image
        run: make image

      - name: Locate artifacts
        id: locate
        run: |
          IMG_DIR="$HOME/system_imaging/disk"
          IMG_GZ="$IMG_DIR/smashbox-rpi-arm64.img.gz"
          IMG_SHA="$IMG_DIR/smashbox-rpi-arm64.img.gz.sha256"
          # Fail loudly if the build silently skipped the output —
          # softprops/action-gh-release has fail_on_unmatched_files
          # but we want a clearer error before we get there.
          test -f "$IMG_GZ"  || { echo "Missing $IMG_GZ"; exit 1; }
          test -f "$IMG_SHA" || { echo "Missing $IMG_SHA"; exit 1; }
          ls -lh "$IMG_GZ" "$IMG_SHA"
          {
            echo "img_gz=$IMG_GZ"
            echo "img_sha=$IMG_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate.outputs.img_gz }}
            ${{ steps.locate.outputs.img_sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: smashbox-rpi-arm64
          path: |
            ${{ steps.locate.outputs.img_gz }}
            ${{ steps.locate.outputs.img_sha }}
          retention-days: 7
