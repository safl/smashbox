name: image

# Build the Raspberry Pi kiosk image so it can be flashed and tested.
# Pushes build it when they touch something that ends up in the image;
# docs and tests alone do not. It can also be run by hand
# (gh workflow run image.yml --ref <branch>). The .img.gz and .sha256
# are kept as a workflow artifact for 7 days.
#
# Pushing a v* tag builds the image and publishes it as a GitHub
# Release. GitHub does not apply path filters to tag pushes, so a tag
# always builds.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - smashbox.py
      - assets/**
      - rootfs/**
      - scripts/**
      - tasks/**
      - configs/**
      - Makefile
      - .github/workflows/image.yml
  workflow_dispatch:

# A newer push to the same branch makes a running build moot. Tag builds
# are never cancelled.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    # Pinned: Ubuntu 26.04 has no qemu-user-static package, which the
    # dependency step below installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        # The build needs ~6 GB free (5 GB raw image + ~700 MB gz +
        # downloaded RPi OS Lite source). The ubuntu-24.04 runner
        # has ~14 GB free out of the box once a few preinstalled
        # SDKs are stripped — these two prunes are the cheapest big
        # wins.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support \
            parted gzip xz-utils curl openssl e2fsprogs \
            pipx
          # binfmt-support's post-install usually registers
          # qemu-aarch64 already, but make it idempotent.
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Install cijoe
        run: |
          pipx install cijoe
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Stamp version from tag
        # On tag pushes, override the in-tree __version__ literal with
        # the pushed tag (stripping the leading `v`). Keeps the
        # released image's reported version in lockstep with the tag
        # even if a manual bump was forgotten.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = .*/__version__ = \"${TAG}\"/" smashbox.py
          grep '^__version__' smashbox.py

      - name: Build image
        run: make image

      - name: Locate artifacts
        id: locate
        run: |
          IMG_DIR="$HOME/system_imaging/disk"
          IMG_GZ="$IMG_DIR/smashbox-rpi-arm64.img.gz"
          IMG_SHA="$IMG_DIR/smashbox-rpi-arm64.img.gz.sha256"
          # Fail loudly if the build silently skipped the output,
          # rather than uploading an empty artifact.
          test -f "$IMG_GZ"  || { echo "Missing $IMG_GZ"; exit 1; }
          test -f "$IMG_SHA" || { echo "Missing $IMG_SHA"; exit 1; }
          ls -lh "$IMG_GZ" "$IMG_SHA"
          {
            echo "img_gz=$IMG_GZ"
            echo "img_sha=$IMG_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smashbox-rpi-arm64
          path: |
            ${{ steps.locate.outputs.img_gz }}
            ${{ steps.locate.outputs.img_sha }}
          retention-days: 7
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # needed by softprops/action-gh-release
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: smashbox-rpi-arm64
          path: image

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            image/smashbox-rpi-arm64.img.gz
            image/smashbox-rpi-arm64.img.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
