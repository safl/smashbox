name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pygame 2.6 ships no wheel for Python 3.14 yet.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Lint
        run: make lint

      - name: Test
        run: make test
