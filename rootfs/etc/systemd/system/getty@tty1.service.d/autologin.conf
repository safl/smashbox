[Service]
# Autologin the smashbox user on tty1. Their .bash_profile then
# launches startx → /opt/smashbox/start.sh → the pygame app.
ExecStart=
ExecStart=-/sbin/agetty --autologin smashbox --noclear %I $TERM
Type=idle
