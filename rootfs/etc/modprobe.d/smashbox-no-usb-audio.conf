# Sound goes out the 3.5 mm jack. USB audio was flaky, and the speaker
# draws its power over USB, which would otherwise register it as a
# second sound card. The install line also blocks a manual modprobe.
blacklist snd_usb_audio
install snd_usb_audio /bin/false
