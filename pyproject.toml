# Tool configuration only. Smashbox is a single script and is not
# packaged.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
